<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hookah Club{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Глобальные темные стили */
        body {
            background-color: #070709 !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: #121216 !important;
            border-bottom: 1px solid rgba(255, 51, 68, 0.15);
        }
        .navbar-brand {
            font-weight: 800;
            color: #ff3344 !important;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-link {
            color: #a0a0a8 !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #ff3344 !important;
        }
        /* Стиль для кнопок управления сменой */
        .nav-link.text-success:hover { color: #28a745 !important; }
        .nav-link.text-warning:hover { color: #ffc107 !important; }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Hookah Club</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/tables">Столики</a>
                <a class="nav-link" href="/reservations">Брони</a>
                <a class="nav-link" href="/orders">Заказы</a>
                <a class="nav-link" href="/tobaccos">Табак</a>
                <a class="nav-link" href="/reports">Отчеты</a>
                <a class="nav-link text-danger" href="/logout">Выход</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    <div id="notification-area" class="container mt-3" style="display: none;">
        <div class="alert alert-danger alert-dismissible fade show" role="alert" style="background-color: rgba(220, 53, 69, 0.1); border: 1px solid #dc3545; color: #ff3344;">
            <span id="error-message"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('error');

        if (errorMessage) {
            const notifyArea = document.getElementById('notification-area');
            const errorText = document.getElementById('error-message');

            // Вставляем текст ошибки
            errorText.innerText = decodeURIComponent(errorMessage);
            // Показываем блок
            notifyArea.style.display = 'block';

            // Очищаем URL, чтобы ошибка исчезла при обновлении страницы
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });
</script>


</body>
</html>
