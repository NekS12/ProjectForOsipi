<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - Hookah Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #070709 !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        .modern-card {
            background-color: #121216 !important;
            border: 1px solid rgba(255, 51, 68, 0.2) !important;
            border-radius: 20px !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8) !important;
            padding: 2rem;
        }
        .card-header {
            background-color: transparent !important;
            border: none !important;
            color: #ff3344 !important;
            font-weight: 800;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .modern-input {
            background-color: #1a1a22 !important;
            border: 1px solid #2d2d3d !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            padding: 0.8rem 1rem !important;
            margin-bottom: 1rem !important;
        }
        .modern-input:focus {
            background-color: #1f1f2a !important;
            border-color: #ff3344 !important;
            box-shadow: 0 0 10px rgba(255, 51, 68, 0.3) !important;
            color: #ffffff !important;
        }
        .btn-neon {
            background-color: #ff3344;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-neon:hover {
            background-color: #e62e3d;
            box-shadow: 0 0 20px rgba(255, 51, 68, 0.5);
            color: #fff;
        }
        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1) !important;
            border: 1px solid rgba(220, 53, 69, 0.3) !important;
            color: #ff8888 !important;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card modern-card">
                <div class="card-header">Вход в систему</div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger text-center">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="post">
                        <input class="form-control modern-input" name="username" placeholder="Логин" required>
                        <input type="password" class="form-control modern-input" name="password" placeholder="Пароль" required>

                        <button class="btn btn-neon w-100 mt-2">
                            Войти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
